    <script>
    const toHide = document.querySelectorAll('.hide-on-scroll');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 0) {
        toHide.forEach(el => el.classList.add('hidden'));
      } else {
        toHide.forEach(el => el.classList.remove('hidden'));
      }
    });
  </script>
